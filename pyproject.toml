# pyproject.toml - Python's own file for n8n-py-generator.
#
# It pins the toolchain. `recipe.ps1 test` runs pytest, mypy, ruff check and ruff
# format, and every setting those four read is here. There are no task-runner
# sections: the recipe's verbs are the tasks.

[build-system]
# Pinned with a version, not a bare name: an unpinned backend changes what
# `recipe.ps1 build` produces without anyone editing this file.
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "n8n-py-generator"
# This must equal $Version in recipe.ps1: `recipe.ps1 test` fails when they disagree.
version = "1.0.0"
description = "Console tool that splits an n8n workflow JSON into a folder per node, builds it back, and collects n8n node documentation."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
# The four packages requirements.txt named, unpinned there; uv.lock pins them.
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pandas>=2.2",
]

[project.scripts]
n8n-gen = "n8n_gen:main"

[dependency-groups]
# `uv run` installs this group by default, so test.yaml's Runner health step finds
# ruff, pytest and mypy through `uv run --frozen <tool> --version`.
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "pytest==8.4.2",
    "pytest-cov==5.0.0",
    "coverage==7.15.2",
]

[tool.setuptools]
# One module at the root.
py-modules = ["n8n_gen"]

[tool.uv]
# The tests and `recipe.ps1 run` use the source tree, so uv does not install the project.
package = false

[tool.ruff]
# Ruff refuses to run at all when its own version is not this one.
required-version = "0.16.1"
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.format]
line-ending = "lf"
# Section 7 prints these files verbatim, so the formatter must not touch them.
exclude = [".claude/**", "tests/manual/serve.py", "tools/wiki.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
# The module sits at the root, so the root goes on sys.path however pytest is started.
pythonpath = ["."]
# Measured on adoption: 239 of 255 statements, 93.7%. The floor is the whole number below.
addopts = "-q --cov=n8n_gen --cov-report=term --cov-fail-under=93"

[tool.mypy]
python_version = "3.13"
files = ["n8n_gen.py", "tools"]

# THE SILENCE LIST, measured on adoption: it only ever gets shorter (R-12).
# 1 name, third-party: pandas ships no py.typed marker at the pinned version.
# None of this repository's own code is silenced.
[[tool.mypy.overrides]]
module = ["pandas.*"]
ignore_missing_imports = true
